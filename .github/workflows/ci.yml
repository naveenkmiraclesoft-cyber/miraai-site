name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, validate, and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks and locale validation
        run: npm run check

      - name: Build all locale pages
        run: npm run build

      - name: Validate built site (sitemap, hreflang, canonicals, draft banners)
        run: npm run validate:site

      - name: Validate HTML for all routes
        run: npm run validate:html

      - name: Browser smoke test (CDP)
        run: npm run test:browser

  autonomous-demo-test:
    name: Autonomous demo CDP test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all locale pages
        run: npm run build

      - name: Autonomous demo test (CDP)
        run: npm run test:autonomous