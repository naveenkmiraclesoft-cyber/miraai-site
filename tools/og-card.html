<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miraAI — OG Card</title>
<link rel="stylesheet" href="../assets/fonts/montserrat.css">
<style>
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    font-family: Montserrat, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #001a33 0%, #06203c 45%, #0b3158 100%);
    color: #fff;
    overflow: hidden;
  }
  .card {
    box-sizing: border-box;
    width: 1200px; height: 630px;
    padding: 68px 76px 60px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .head { display: flex; align-items: center; gap: 24px; }
  .logo { width: 300px; height: auto; }
  .domain { margin-left: auto; font-size: 18px; font-weight: 700; letter-spacing: .04em; color: rgba(255,255,255,.55); }
  h1 { margin: 18px 0 16px; font-size: 72px; line-height: 1.06; letter-spacing: -.02em; font-weight: 700; }
  .eyebrow { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: #00aae7; }
  .sub { margin: 0; font-size: 25px; line-height: 1.5; color: rgba(255,255,255,.82); max-width: 62ch; }
  .foot { display: flex; align-items: center; gap: 18px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.16); }
  .pill {
    font-size: 17px; font-weight: 700; color: #001a33;
    background: #ebf6ff; border-radius: 999px; padding: 12px 26px;
  }
  .muted { font-size: 17px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.5); }
</style>
</head>
<body>
<main class="card">
  <header class="head">
    <img class="logo" src="../assets/miraai-white-horizontal.svg" alt="miraAI">
    <span class="domain">Miraclesoft</span>
  </header>
  <section>
    <p class="eyebrow">miraAI</p>
    <h1>Govern and Scale<br>Enterprise AI</h1>
    <p class="sub">Connect enterprise knowledge, data, models, and workflows through one governed AI platform.</p>
  </section>
  <footer class="foot">
    <span class="pill">Schedule an Executive Briefing</span>
    <span class="muted">miraclesoft.com/miraai</span>
  </footer>
</main>
</body>
</html>
